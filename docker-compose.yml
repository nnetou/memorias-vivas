version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memorias_vivas_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    # Caso necessário, garantimos a leitura persistente das logs e watch do reload.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15-alpine
    container_name: memorias_vivas_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memorias_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-memorias_vivas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: memorias_vivas_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  postgres_data:
  redis_data:
