<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Teste WebSocket — Memórias Vivas</title>
  <style>
    body { font-family: system-ui; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f9f9f9; }
    h1 { color: #1e3a5f; }
    button { padding: 12px 24px; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; margin: 6px; }
    #btnLigar    { background: #1e3a5f; color: white; }
    #btnGravar   { background: #16a34a; color: white; display: none; }
    #btnParar    { background: #dc2626; color: white; display: none; }
    #btnDesligar { background: #6b7280; color: white; display: none; }
    #estado { padding: 10px; border-radius: 6px; margin: 12px 0; font-weight: 500; }
    .ligado    { background: #dcfce7; color: #166534; }
    .desligado { background: #fee2e2; color: #991b1b; }
    .aguardar  { background: #fef9c3; color: #854d0e; }
    #log { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px;
           height: 320px; overflow-y: auto; font-family: monospace; font-size: 13px; }
    .msg-in   { color: #1d4ed8; }
    .msg-out  { color: #166534; }
    .msg-erro { color: #dc2626; }
    .msg-audio{ color: #7c3aed; }
    #transcricao { font-size: 15px; color: #374151; padding: 8px; background: #f0f9ff;
                   border-radius: 6px; margin: 8px 0; min-height: 32px; }
    #resposta    { font-size: 15px; color: #1e3a5f; padding: 8px; background: #eff6ff;
                   border-radius: 6px; margin: 8px 0; min-height: 32px; }
    label { font-size: 13px; color: #6b7280; display: block; margin-bottom: 2px; }
    input, select { padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;
                    font-size: 14px; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
  </style>
</head>
<body>

<h1>🎤 Teste WebSocket — Memórias Vivas</h1>

<label>user_id</label>
<input id="userId" value="a1b2c3d4-e5f6-7890-abcd-ef1234567890">

<label>tema</label>
<select id="tema">
  <option value="memorias">Memórias</option>
  <option value="familia">Família</option>
  <option value="saude">Saúde</option>
  <option value="geral">Geral</option>
</select>

<label>voz</label>
<select id="voz">
  <option value="pt-PT-RaquelNeural">Raquel (feminina)</option>
  <option value="pt-PT-DuarteNeural">Duarte (masculino)</option>
</select>

<div>
  <button id="btnLigar"    onclick="ligar()">Ligar</button>
  <button id="btnGravar"   onclick="iniciarGravacao()">🎤 Gravar</button>
  <button id="btnParar"    onclick="pararGravacao()">⏹ Parar e Enviar</button>
  <button id="btnDesligar" onclick="desligar()">Desligar</button>
</div>

<div id="estado" class="desligado">Desligado</div>

<label>Transcrição recebida:</label>
<div id="transcricao">—</div>

<label>Resposta do assistente:</label>
<div id="resposta">—</div>

<label>Log de mensagens:</label>
<div id="log"></div>

<script>
  let ws = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let audioQueue = [];
  let sessionId = null;
  let isPlayingAudio = false;

  // ── Logging ──────────────────────────────────────────────────────────────
  function log(msg, tipo = "in") {
    const div = document.getElementById("log");
    const linha = document.createElement("div");
    linha.className = `msg-${tipo}`;
    linha.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    div.appendChild(linha);
    div.scrollTop = div.scrollHeight;
  }

  function setEstado(texto, classe) {
    const el = document.getElementById("estado");
    el.textContent = texto;
    el.className = classe;
  }

  // ── Ligação WebSocket ────────────────────────────────────────────────────
  function ligar() {
    const userId = document.getElementById("userId").value.trim();
    const tema   = document.getElementById("tema").value;
    const voz    = document.getElementById("voz").value;

    ws = new WebSocket("ws://localhost:8000/api/v1/audio/ws/conversa");
    ws.binaryType = "arraybuffer";

    ws.onopen = () => {
      log("WebSocket ligado", "out");
      setEstado("A iniciar sessão...", "aguardar");

      const init = { type: "init", user_id: userId, session_id: null, tema, voz };
      ws.send(JSON.stringify(init));
      log("→ init enviado: " + JSON.stringify(init), "out");
    };

    ws.onmessage = (event) => {
      // Mensagem binária — chunk de áudio MP3
      if (event.data instanceof ArrayBuffer) {
        log(`← áudio chunk: ${event.data.byteLength} bytes`, "audio");
        audioQueue.push(event.data);
        return;
      }

      // Mensagem JSON
      const msg = JSON.parse(event.data);
      log("← " + JSON.stringify(msg), "in");

      if (msg.type === "pronto") {
        sessionId = msg.session_id;
        setEstado("✅ Ligado — session: " + sessionId.slice(0, 8) + "...", "ligado");
        document.getElementById("btnLigar").style.display    = "none";
        document.getElementById("btnGravar").style.display   = "inline";
        document.getElementById("btnDesligar").style.display = "inline";
      }

      if (msg.type === "transcricao") {
        document.getElementById("transcricao").textContent = msg.texto;
      }

      if (msg.type === "resposta") {
        document.getElementById("resposta").textContent = msg.texto;
      }

      if (msg.type === "audio_inicio") {
        audioQueue = [];
        log("← a receber áudio...", "audio");
      }

      if (msg.type === "audio_fim") {
        reproduzirAudio();
        // Reativar botão de gravação após reprodução
        setTimeout(() => {
          document.getElementById("btnGravar").style.display = "inline";
          document.getElementById("btnParar").style.display  = "none";
          setEstado("✅ Pronto — pode gravar novamente", "ligado");
        }, 500);
      }

      if (msg.type === "pedir_repeticao") {
        log(`← pedir_repeticao (motivo: ${msg.motivo})`, "erro");
        // O áudio do pedido de repetição vem logo a seguir via audio_inicio/fim
      }

      if (msg.type === "erro") {
        log("← ERRO PROTOCOLO: " + msg.mensagem, "erro");
        setEstado("Erro de protocolo — ver log", "desligado");
      }
    };

    ws.onerror = (e) => { log("WebSocket erro: " + e, "erro"); };
    ws.onclose = () => {
      log("WebSocket desligado", "erro");
      setEstado("Desligado", "desligado");
      document.getElementById("btnLigar").style.display    = "inline";
      document.getElementById("btnGravar").style.display   = "none";
      document.getElementById("btnParar").style.display    = "none";
      document.getElementById("btnDesligar").style.display = "none";
    };
  }

  // ── Gravação ─────────────────────────────────────────────────────────────
  async function iniciarGravacao() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.start();
    setEstado("🔴 A gravar...", "aguardar");
    document.getElementById("btnGravar").style.display = "none";
    document.getElementById("btnParar").style.display  = "inline";
    log("→ gravação iniciada", "out");
  }

  async function pararGravacao() {
    return new Promise((resolve) => {
      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: "audio/webm" });
        const buffer = await blob.arrayBuffer();
        ws.send(buffer);
        log(`→ áudio enviado: ${buffer.byteLength} bytes`, "out");
        setEstado("⏳ A processar...", "aguardar");
        resolve();
      };
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
    });
  }

  // ── Reprodução áudio ──────────────────────────────────────────────────────
  function reproduzirAudio() {
    if (audioQueue.length === 0) return;

    const totalLength = audioQueue.reduce((acc, b) => acc + b.byteLength, 0);
    const combined = new Uint8Array(totalLength);
    let offset = 0;
    for (const chunk of audioQueue) {
      combined.set(new Uint8Array(chunk), offset);
      offset += chunk.byteLength;
    }

    const blob = new Blob([combined], { type: "audio/mpeg" });
    const url  = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.play();
    log(`← a reproduzir MP3 (${totalLength} bytes)`, "audio");
  }

  function desligar() {
    if (ws) ws.close();
  }
</script>
</body>
</html>
